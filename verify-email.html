<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your email — FlickZZ Resources</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/features.css">
</head>
<body class="auth-page">
    <div class="auth-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="auth-wrapper">
        <a href="index.html" class="logo auth-logo">
            <img src="images/logo.png" alt="FlickZZ" class="logo-img logo-img-lg">
            <span>Flick<span class="logo-accent">ZZ</span></span>
        </a>

        <div class="auth-card" style="text-align:center;">
            <div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;box-shadow:0 10px 30px rgba(99,102,241,0.4);">
                <i class="fas fa-envelope-open-text" style="font-size:2.5rem;color:white;"></i>
            </div>

            <h1 style="font-size:1.75rem;margin-bottom:0.75rem;">Check your email</h1>
            <p style="color:var(--text-muted);margin-bottom:0.5rem;">
                We've sent a verification link to:
            </p>
            <p id="userEmailDisplay" style="font-weight:700;color:var(--primary);margin-bottom:1.5rem;word-break:break-all;">
                your email
            </p>

            <div style="background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);border-radius:12px;padding:1rem;margin-bottom:1.5rem;text-align:left;">
                <p style="font-size:0.9rem;color:var(--text-muted);margin:0;line-height:1.6;">
                    <i class="fas fa-info-circle" style="color:var(--primary);"></i>
                    Click the link inside the email to verify your account.
                    Then come back and log in.<br><br>
                    <strong style="color:var(--text);">Can't find it?</strong> Check your <strong>Spam</strong> or <strong>Promotions</strong> folder.
                </p>
            </div>

            <a href="login.html" class="btn btn-primary btn-block" style="margin-bottom:0.75rem;">
                <i class="fas fa-sign-in-alt"></i> I've verified — Log In
            </a>
            <button id="resendBtn" class="btn btn-outline btn-block">
                <i class="fas fa-paper-plane"></i> Resend verification email
            </button>

            <p style="margin-top:1.5rem;font-size:0.85rem;color:var(--text-muted);">
                Wrong email? <a href="signup.html" style="color:var(--primary);">Sign up again</a>
            </p>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { auth } from "./js/firebase-config.js";
        import { signInWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { showToast } from "./js/main.js";

        const email = sessionStorage.getItem('pendingVerifyEmail') || '';
        document.getElementById('userEmailDisplay').textContent = email || 'your email';

        document.getElementById('resendBtn').addEventListener('click', async () => {
            const btn = document.getElementById('resendBtn');
            const password = prompt('For security, please re-enter your password to resend:');
            if (!password) return;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Sending...';
            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                await sendEmailVerification(cred.user, {
                    url: window.location.origin + '/login.html?verified=1',
                    handleCodeInApp: false
                });
                await signOut(auth);
                showToast('✅ Verification email resent!', 'success');
            } catch (err) {
                showToast(err.message || 'Could not resend', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Resend verification email';
            }
        });
    </script>
    <script src="js/protection.js"></script>
</body>
</html>
