<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your email — FlickZZ</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="auth-page">
    <div class="auth-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="auth-wrapper">
        <a href="index.html" class="logo auth-logo">
            <img src="images/logo.png" alt="FlickZZ" class="logo-img logo-img-lg">
            <span>Flick<span class="logo-accent">ZZ</span></span>
        </a>

        <div class="auth-card" style="text-align:center;">
            <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;box-shadow:0 10px 30px rgba(99,102,241,0.4);">
                <i class="fas fa-envelope-open-text" style="font-size:2rem;color:white;"></i>
            </div>

            <h1 style="font-size:1.5rem;margin-bottom:0.5rem;">Verify Your Email</h1>
            <p style="color:var(--text-muted);margin-bottom:0.25rem;">
                Enter the 6-digit code sent to:
            </p>
            <p id="userEmailDisplay" style="font-weight:700;color:var(--primary);margin-bottom:1.5rem;word-break:break-all;">
                your email
            </p>

            <!-- OTP Input Section -->
            <div style="margin-bottom:1.5rem;">
                <div style="display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;">
                    <input type="text" id="otp1" maxlength="1" style="width:50px;height:60px;text-align:center;font-size:1.8rem;font-weight:700;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--text);">
                    <input type="text" id="otp2" maxlength="1" style="width:50px;height:60px;text-align:center;font-size:1.8rem;font-weight:700;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--text);">
                    <input type="text" id="otp3" maxlength="1" style="width:50px;height:60px;text-align:center;font-size:1.8rem;font-weight:700;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--text);">
                    <input type="text" id="otp4" maxlength="1" style="width:50px;height:60px;text-align:center;font-size:1.8rem;font-weight:700;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--text);">
                    <input type="text" id="otp5" maxlength="1" style="width:50px;height:60px;text-align:center;font-size:1.8rem;font-weight:700;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--text);">
                    <input type="text" id="otp6" maxlength="1" style="width:50px;height:60px;text-align:center;font-size:1.8rem;font-weight:700;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--text);">
                </div>
                <small style="color:var(--text-dim);display:block;margin-top:0.5rem;">Enter the 6-digit code from your email</small>
            </div>

            <button id="verifyBtn" class="btn btn-primary btn-block" style="margin-bottom:0.75rem;">
                <i class="fas fa-check-circle"></i> Verify & Log In
            </button>

            <button id="resendBtn" class="btn btn-outline btn-block">
                <i class="fas fa-paper-plane"></i> Resend Code
            </button>

            <p style="margin-top:1.5rem;font-size:0.85rem;color:var(--text-muted);">
                Wrong email? <a href="signup.html" style="color:var(--primary);">Sign up again</a>
            </p>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { auth } from "./js/firebase-config.js";
        import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { showToast } from "./js/main.js";

        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        const email = urlParams.get('email') || sessionStorage.getItem('pendingVerifyEmail') || '';

        document.getElementById('userEmailDisplay').textContent = email || 'your email';

        const inputs = [1,2,3,4,5,6].map(i => document.getElementById(`otp${i}`));
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value.length === 1 && index < 5) {
                    inputs[index + 1].focus();
                }
                if (inputs.every(inp => inp.value.length === 1)) {
                    verifyOTP();
                }
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
                if (e.key === 'Enter') {
                    verifyOTP();
                }
            });
        });

        async function verifyOTP() {
            const otp = inputs.map(inp => inp.value).join('');
            if (otp.length !== 6) {
                showToast('Please enter the full 6-digit code', 'warning');
                return;
            }

            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Verifying...';

            try {
                const res = await fetch('/api/verify-email-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid, code: otp })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Verification failed');

                showToast('✅ Email verified! Redirecting...', 'success');
                
                // ✅ Try to auto-login if user is already signed in (from signup)
                // Otherwise redirect to login page
                try {
                    // Check if user is already logged in
                    if (auth.currentUser) {
                        // User is already logged in from signup
                        await auth.currentUser.reload();
                        if (auth.currentUser.emailVerified) {
                            window.location.href = 'dashboard.html';
                            return;
                        }
                    }
                    // If not logged in, redirect to login
                    setTimeout(() => {
                        window.location.href = `login.html?verified=1&email=${encodeURIComponent(email)}`;
                    }, 1500);
                } catch (loginErr) {
                    setTimeout(() => {
                        window.location.href = `login.html?verified=1&email=${encodeURIComponent(email)}`;
                    }, 1500);
                }
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify & Log In';
                inputs.forEach(inp => inp.value = '');
                inputs[0].focus();
            }
        }

        document.getElementById('verifyBtn').addEventListener('click', verifyOTP);

        // Resend code
        document.getElementById('resendBtn').addEventListener('click', async () => {
            const btn = document.getElementById('resendBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Sending...';
            try {
                const res = await fetch('/api/resend-verification-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid, email })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to resend');
                showToast('✅ New code sent! Check your email.', 'success');
                inputs.forEach(inp => inp.value = '');
                inputs[0].focus();
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Resend Code';
            }
        });
    </script>
    <script src="js/protection.js"></script>
</body>
</html>
