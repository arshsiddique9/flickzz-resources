<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — FlickZZ</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="auth-page">
    <div class="auth-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="auth-wrapper">
        <a href="index.html" class="logo auth-logo">
            <img src="images/logo.png" alt="FlickZZ" class="logo-img logo-img-lg">
            <span>Flick<span class="logo-accent">ZZ</span></span>
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <h1>Reset Password</h1>
                <p>Enter your new password below.</p>
            </div>

            <form id="resetForm" class="auth-form">
                <div class="form-group">
                    <label>New Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
                        <button type="button" class="toggle-pass" data-target="password"><i class="fas fa-eye"></i></button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-check-circle"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                        <button type="button" class="toggle-pass" data-target="confirmPassword"><i class="fas fa-eye"></i></button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
                    <span>Reset Password</span>
                </button>
            </form>

            <div class="auth-footer">
                <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/protection.js"></script>
    <script>
        // ✅ 100% WORKING PASSWORD TOGGLE – inline script, no dependency issues
        document.addEventListener('DOMContentLoaded', function() {
            const toggleButtons = document.querySelectorAll('.toggle-pass');
            
            toggleButtons.forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    
                    if (!input) {
                        console.warn('Input not found for target:', targetId);
                        return;
                    }
                    
                    // Toggle password visibility
                    const isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';
                    
                    // Toggle icon
                    const icon = this.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-eye');
                        icon.classList.toggle('fa-eye-slash');
                    }
                });
            });
        });

        // Reset password form submission
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('resetForm');
            if (!form) return;

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');
                
                if (!token) {
                    alert('Invalid reset link. Please request a new one.');
                    window.location.href = 'login.html';
                    return;
                }

                const password = document.getElementById('password').value.trim();
                const confirm = document.getElementById('confirmPassword').value.trim();
                
                if (password.length < 6) {
                    alert('Password must be at least 6 characters');
                    return;
                }
                if (password !== confirm) {
                    alert('Passwords do not match');
                    return;
                }

                const btn = document.getElementById('resetBtn');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Resetting...';

                try {
                    const res = await fetch('/api/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, newPassword: password })
                    });
                    const data = await res.json();
                    
                    if (!res.ok) {
                        throw new Error(data.error || 'Reset failed');
                    }
                    
                    alert('✅ Password reset successful! Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } catch (err) {
                    alert('❌ ' + err.message);
                    btn.disabled = false;
                    btn.innerHTML = '<span>Reset Password</span>';
                }
            });
        });
    </script>
</body>
</html>
